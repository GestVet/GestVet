[project]
name = "gestvet-backend"
version = "0.1.0"
description = "Backend hexagonal de GestVet"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestvet"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un aviso es un fallo. Es la forma barata de enterarse de una deprecación
# cuando todavía queda una versión de margen para atenderla.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Las importaciones relativas cruzando paquetes esconden las dependencias que
# Import Linter debe poder ver, así que solo se permiten dentro de un módulo.
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Contratos de arquitectura hexagonal.
#
# Se verifican con `uv run lint-imports`. Import Linter construye el grafo real
# de importaciones, así que una violación falla aunque el nombre de la carpeta
# parezca correcto.
#
# Todos los contratos usan comodines sobre `gestvet.*` en vez de nombrar los
# módulos uno por uno. Es deliberado: un módulo nuevo queda cubierto el día que
# se crea, sin que nadie tenga que acordarse de editar este archivo.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "gestvet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas hexagonales dentro de cada modulo"
type = "layers"
# El orden va de fuera hacia dentro. Una capa solo puede importar las que están
# por debajo de ella. Los paréntesis las hacen opcionales, para que el contrato
# valga también para un módulo compartido que no tenga las cuatro.
layers = [
    "(adapters)",
    "(use_cases)",
    "(ports)",
    "(domain)",
]
containers = [
    "gestvet.*",
]

[[tool.importlinter.contracts]]
name = "El dominio y los casos de uso no conocen la tecnologia"
type = "forbidden"
source_modules = [
    "gestvet.*.domain",
    "gestvet.*.ports",
    "gestvet.*.use_cases",
]
# La lista incluye toda dependencia de tercero del proyecto, no solo el ORM y
# el framework web. El dominio es Python puro: tampoco puede conocer Pydantic,
# ni la librería de cifrado, ni la de tokens.
forbidden_modules = [
    "alembic",
    "asyncpg",
    "bcrypt",
    "fastapi",
    "httpx",
    "jwt",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "starlette",
    "uvicorn",
    "gestvet.core.database",
    "gestvet.core.security",
]

[[tool.importlinter.contracts]]
name = "Los modulos de dominio no se importan entre si"
type = "independence"
# `independence` es simétrico, a diferencia de `forbidden`: cubre las dos
# direcciones, así que un módulo nuevo tampoco puede importar a los que ya
# existían.
modules = [
    "gestvet.*",
]
ignore_imports = [
    # El núcleo compartido está para ser usado: la prohibición corre en el otro
    # sentido y la declara el contrato siguiente.
    "gestvet.** -> gestvet.core.**",
    # `main` es la raíz de composición. Su trabajo es conocer a todos los
    # módulos para montar sus routers.
    "gestvet.main -> gestvet.**",
]

[[tool.importlinter.contracts]]
name = "El nucleo compartido no depende de los modulos de dominio"
type = "forbidden"
source_modules = [
    "gestvet.core",
]
forbidden_modules = [
    "gestvet.*",
]
