services:
  db:
    image: postgres:17-alpine
    container_name: gestvet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestvet
      POSTGRES_USER: gestvet
      POSTGRES_PASSWORD: gestvet_dev_only
    ports:
      - "5432:5432"
    volumes:
      - gestvet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestvet -d gestvet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestvet_postgres_data:
