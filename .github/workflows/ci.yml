# Las mismas comprobaciones que corre `pnpm verify` en local. El hook de Git es
# una comodidad y se puede saltar con --no-verify; esto no.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El rango declarado en pyproject.toml, comprobado de punta a punta.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sincronizar dependencias
        working-directory: backend
        run: uv sync --locked --group dev

      - name: Ruff, reglas
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff, formato
        working-directory: backend
        run: uv run ruff format --check .

      - name: Contratos de arquitectura hexagonal
        working-directory: backend
        run: uv run lint-imports

      - name: Pruebas
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint:frontend

      - name: Verificación de tipos y compilación
        run: pnpm build:frontend

  contract:
    name: Contrato OpenAPI sincronizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: |
          uv --directory backend sync --locked --group dev
          pnpm install --frozen-lockfile

      - name: Regenerar los tipos desde el esquema del backend
        run: pnpm generate:api

      - name: Fallar si el contrato quedó desactualizado
        run: |
          if ! git diff --exit-code -- frontend/src/api/schema.d.ts; then
            echo '::error::El contrato del backend cambió y los tipos del frontend no.'
            echo "Ejecutá 'pnpm generate:api' y sumá el resultado al commit."
            exit 1
          fi
