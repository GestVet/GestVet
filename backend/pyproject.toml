[project]
name = "gestvet-backend"
version = "0.1.0"
description = "Backend hexagonal de GestVet"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestvet"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Las importaciones relativas cruzando paquetes esconden las dependencias que
# Import Linter debe poder ver, así que solo se permiten dentro de un módulo.
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Contratos de arquitectura hexagonal.
#
# Se verifican con `uv run lint-imports`. Import Linter construye el grafo real
# de importaciones, así que una violación falla aunque el nombre de la carpeta
# parezca correcto.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "gestvet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas hexagonales dentro de cada módulo de dominio"
type = "layers"
# El orden va de fuera hacia dentro. Una capa solo puede importar las que
# están por debajo de ella.
layers = [
    "adapters",
    "use_cases",
    "ports",
    "domain",
]
containers = [
    "gestvet.accounts",
]

[[tool.importlinter.contracts]]
name = "El dominio y los casos de uso no conocen la tecnologia"
type = "forbidden"
source_modules = [
    "gestvet.accounts.domain",
    "gestvet.accounts.ports",
    "gestvet.accounts.use_cases",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "starlette",
    "gestvet.core.database",
]

[[tool.importlinter.contracts]]
name = "Los modulos de dominio no se importan entre si"
type = "forbidden"
source_modules = [
    "gestvet.accounts",
]
forbidden_modules = [
    "gestvet.pets",
    "gestvet.veterinarians",
    "gestvet.availability",
    "gestvet.appointments",
]

[[tool.importlinter.contracts]]
name = "El nucleo compartido no depende de los modulos de dominio"
type = "forbidden"
source_modules = [
    "gestvet.core",
]
forbidden_modules = [
    "gestvet.accounts",
    "gestvet.pets",
    "gestvet.veterinarians",
    "gestvet.availability",
    "gestvet.appointments",
]
