# Blueprint de Render para GestVet.
#
# Un solo recurso en Render: el backend FastAPI (Web Service, runtime
# Python + uv). El frontend se despliega aparte, en Vercel (ver
# vercel.json / configuración del proyecto en el dashboard de Vercel), así
# que no hay un segundo `service` acá. La base de datos tampoco es un
# recurso de Render: es un proyecto Postgres de Supabase, externo al
# Blueprint, por eso no aparece una sección `databases:` acá.
#
# Nota sobre DATABASE_URL / Supabase: pegar la cadena del **Session Pooler**
# de Supabase (Project Settings → Database → Connection string → "Session
# pooler", puerto 5432), no la del **Transaction Pooler** (puerto 6543): ese
# modo no soporta prepared statements y el backend usa asyncpg con
# SQLAlchemy sin desactivarlos (ver backend/src/gestvet/core/database.py),
# así que rompe con "prepared statement already exists". Tampoco la
# conexión "Direct" (5432 sin pooler): en Supabase resuelve solo a IPv6 y
# Render no garantiza salida IPv6. Cambiar el prefijo de `postgresql://` a
# `postgresql+asyncpg://` antes de pegarla (ver backend/src/gestvet/core/config.py).
#
# Nota sobre los adjuntos:
# Los adjuntos de la historia clínica y evidencias de reclamos se guardan en
# un bucket público de Supabase Storage (`SupabaseAttachmentStorage`), por lo que
# no dependen del disco del servidor y persisten a través de despliegues y
# suspensiones por inactividad en el plan Free de Render. Requiere configurar
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY y SUPABASE_STORAGE_BUCKET.
# En desarrollo local o si faltan esas variables, se usa almacenamiento local
# (`LocalDiskAttachmentStorage`) en ATTACHMENTS_STORAGE_DIR.

services:
  - type: web
    name: gestvet-api
    runtime: python
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev && uv run alembic upgrade head
    startCommand: uv run uvicorn gestvet.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: APP_NAME
        value: gestvet-api
      - key: APP_VERSION
        value: 0.1.0
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"

      # Cadena de conexión de Supabase (Session Pooler, puerto 5432, prefijo
      # postgresql+asyncpg://). No vive en el repo: se carga una sola vez
      # desde el Dashboard de Render tras el primer despliegue del Blueprint.
      - key: DATABASE_URL
        sync: false

      # Dominio del proyecto de Vercel (frontend) y de este mismo servicio.
      # Ajustar si el proyecto de Vercel termina con otro nombre o dominio propio.
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://gestvet-pi.vercel.app"]'
      - key: FRONTEND_BASE_URL
        value: https://gestvet-pi.vercel.app
      - key: API_BASE_URL
        value: https://gestvet-api.onrender.com

      # Almacenamiento persistente en Supabase Storage (bucket público).
      # Evita la pérdida de datos en el plan Free de Render sin disco persistente.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: attachments

      # Ruta local para adjuntos (solo se usa como respaldo o en local sin Supabase).
      - key: ATTACHMENTS_STORAGE_DIR
        value: ./var/attachments

      # Token secreto para que GitHub Actions (.github/workflows/reminders-cron.yml)
      # despierte al backend cada 30 min (lun-vie, hora de Lima) y ejecute los recordatorios de WhatsApp.
      - key: REMINDERS_CRON_TOKEN
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "3600"

      # Asistente de IA (OpenRouter) y verificación de DNI (Factiliza) son
      # opcionales: sin clave, esas features quedan apagadas y el resto de la
      # app funciona igual (ver backend/src/gestvet/core/config.py).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_FALLBACK_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "45"
      - key: FACTILIZA_API_KEY
        sync: false
