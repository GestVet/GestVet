# Un solo espacio de trabajo para todo el repositorio. Antes el frontend tenía
# su propio archivo y su propio bloqueo, así que las dependencias se instalaban
# dos veces y podían divergir sin que nada avisara.
packages:
  - frontend

allowBuilds:
  # Resolutor nativo que usa eslint-import-resolver-typescript para seguir
  # importaciones sin extensión. Sin su compilación, los límites de arquitectura
  # no resuelven módulos y las reglas quedan inertes.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/node@22.20.2 || 24.13.4'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - lint-staged@17.5.1
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - vite@8.3.0
  - zod@4.6.1
