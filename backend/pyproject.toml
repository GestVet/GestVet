[project]
name = "gestvet-backend"
version = "0.1.0"
description = "Backend hexagonal de GestVet"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestvet"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Las importaciones relativas cruzando paquetes esconden las dependencias que
# Import Linter debe poder ver, así que solo se permiten dentro de un módulo.
ban-relative-imports = "parents"
